version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_install:
      # Only the docs dependency group; the docs don't import the package.
      - python -m pip install --upgrade "pip>=25.1"
      - python -m pip install --group docs

sphinx:
  builder: html
  configuration: docs/source/conf.py
  fail_on_warning: true
